name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to a branch makes the first run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Everything that does not need the 4.43 GB model or a real display: format,
  # lint, types, the three import-linter contracts, dependency-cruiser, units.
  check:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: sidecar/uv.lock

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - run: make setup
      - run: make check

  # The adapters against the real LanceDB, the real pdfium and the real
  # filesystem. These are the tests that have caught fake-versus-real drift,
  # which is the failure this project keeps hitting.
  integration:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: sidecar/uv.lock

      - run: uv --directory sidecar sync --all-extras
      - run: make check-int
